services:
  - type: web
    name: hilla-pv-cleaner
    runtime: python
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: COMMAND_URL
        value: https://raw.githubusercontent.com/abdalhafadle-source/hilla-pv-cleaner/main/output/command.json
      - key: LOG_URL
        value: https://raw.githubusercontent.com/abdalhafadle-source/hilla-pv-cleaner/main/output/decision_log.csv
