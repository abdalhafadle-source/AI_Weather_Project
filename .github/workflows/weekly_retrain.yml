name: weekly_retrain
on:
  schedule:
    - cron: "0 23 * * 4"   # Friday 02:00 Baghdad
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writer
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python retrain.py
      - name: Commit data, models and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_hilla data/raw_hilla_extra data/raw_metar models reports/retrain_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "weekly retrain $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
